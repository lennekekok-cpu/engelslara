function initial(){return {version:1,lists:[{id:'school-unit1',name:'Unit 1 · Dit ben ik',date:'',active:true,words:pairs.map(([en,nl,...alts],i)=>({id:'school-'+i,en,nl,alts,enAlts:[]}))}],progress:{},rewards:[],music:false};}

const skills=['listen'];
const normalize=s=>s.toLowerCase().replace(/[‘’]/g,"'").replace(/[.…]+/g,' ').trim().replace(/[?!]+$/,'').trim().replace(/\s+/g,' ');
function distance(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]!==b[j-1]));prev=old;}}return row[b.length];}
function assess(word,skill,input){const answers=((skill==='en-nl'||skill==='listen')?[word.nl,...word.alts]:[word.en,...(word.enAlts||[])]).map(normalize);const value=normalize(input);if(answers.includes(value))return 'correct';if(value.length>=4&&answers.some(a=>distance(value,a)===1))return 'typo';return 'wrong';}

 const key=id+':'+skill;const p=state.progress[key]||{days:[],sessions:[],attempts:0,helped:0,wrong:0};p.attempts++;p.last=now;
 if(result==='typo')p.recognized=(p.recognized||0)+1;
 if(skill==='speech'){p.practiced=(p.practiced||0)+1;p.due=now+86400000;}
 else if((result==='correct'||((skill==='en-nl'||skill==='listen')&&result==='typo'))&&!help){const day=new Date(now).toISOString().slice(0,10);if(!p.days.includes(day)&&!p.sessions.includes(session)){p.days.push(day);p.sessions.push(session);}p.due=now+[1,3,7,14][Math.min(p.days.length-1,3)]*86400000;p.lastResult='independent';}
 else{if(help)p.helped++;else p.wrong++;p.lastResult=help?'helped':'practice';p.due=now+60000;}
 state.progress[key]=p;return p;
}

function parsePairs(text){const rows=[];let field='',row=[],quoted=false;const delimiter=text.includes('\t')?'\t':text.includes(';')?';':',';for(let i=0;i<=text.length;i++){const c=text[i]??'\n';if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(!quoted&&(c===delimiter||c==='\n')){row.push(field.trim());field='';if(c==='\n'){if(row.some(Boolean))rows.push(row);row=[];}}else if(c!=='\r')field+=c;}if(quoted)throw Error('Een aanhalingsteken is niet afgesloten.');if(rows[0]&&/^(engels|english|en)$/i.test(rows[0][0]))rows.shift();return rows.map(r=>({en:r[0]||'',nl:r[1]||'',alts:(r[2]||'').split('|').map(s=>s.trim()).filter(Boolean),enAlts:(r[3]||'').split('|').map(s=>s.trim()).filter(Boolean)}));}

function shuffled(values,rng=Math.random){const out=[...values];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function createGame(words,rng=Math.random){const deck=shuffled(words,rng).sort((a,b)=>Number(/\.{2,}|…/.test(a.en))-Number(/\.{2,}|…/.test(b.en)));return {deck,offset:0,words:deck.slice(0,10),index:0,phase:'learn',repeat:false,mistakes:[],completed:0,reviewed:0,wordFailed:false,choiceFailed:false,englishHelp:false,listened:false,attemptedAudio:false,correct:0,options:null,triedChoices:[],retryMistakes:[],blockClean:false};}

 // For short parent-created lists, use real translations from the supplied school list as fallback.

function completeWord(game){
 const word=game.words[game.index];
 if(!game.repeat){game.completed++;if(game.wordFailed&&!game.mistakes.some(w=>w.id===word.id))game.mistakes.push(word);}
 else{game.reviewed++;if(game.wordFailed&&!game.retryMistakes.some(w=>w.id===word.id))game.retryMistakes.push(word);}

 else{game.blockClean=true;game.phase=game.offset+10<game.deck.length?'block-end':'end';}
}

function logCheck(state,id,correct,help=false,now=Date.now()){
 initExtras(state);const p=state.practice[id]??={passes:0,goodPasses:0,cleanDays:[],recallDays:[]};

 initExtras(state);if(!game.blockClean)return null;
 const ids=game.deck.slice(game.offset,game.offset+10).map(w=>w.id).sort();const day=dayKey(now),key=JSON.stringify([day,ids]);

function childlikeVoice(voices,uri=''){

}
function comparison(typed,expected,correct=false){

 const aa=letters(a),bb=letters(b),dp=Array.from({length:aa.length+1},()=>Array(bb.length+1).fill(0));
 for(let i=aa.length-1;i>=0;i--)for(let j=bb.length-1;j>=0;j--)dp[i][j]=aa[i].c.toLowerCase()===bb[j].c.toLowerCase()?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 let i=0,j=0;const left=new Set(),right=new Set();while(i<aa.length||j<bb.length){if(i<aa.length&&j<bb.length&&aa[i].c.toLowerCase()===bb[j].c.toLowerCase()){i++;j++;}else if(i<aa.length&&(j===bb.length||dp[i+1][j]>=dp[i][j+1]))left.add(aa[i++].i);else right.add(bb[j++].i);}

 return {typed:paint(a,left),expected:paint(b,right)};
}

let applauseContext=null;

function party({sound=true,confetti=true}={},big=false){
 stopParty();
 if(confetti&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const layer=document.createElement('div');layer.className='confetti-burst';layer.setAttribute('aria-hidden','true');for(let i=0;i<(big?65:30);i++){const dot=document.createElement('i');dot.style.setProperty('--x',`${(Math.random()-.5)*85}vw`);dot.style.setProperty('--r',`${Math.random()*900}deg`);dot.style.setProperty('--c',['#b292ee','#58d4cc','#f8c67b','#ef9dbb'][i%4]);dot.style.left=`${35+Math.random()*30}%`;dot.style.animationDelay=`${Math.random()*.12}s`;layer.append(dot);}document.body.append(layer);setTimeout(()=>layer.remove(),1400);}
 if(!sound)return;
 const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
 try{const ctx=applauseContext=new Audio();ctx.resume().catch(()=>{});const master=ctx.createGain();master.gain.value=.17;master.connect(ctx.destination);
 // Layered short noise transients create a quiet crowd-clapping sound, not a success beep.
 for(let i=0;i<(big?24:15);i++){const source=ctx.createBufferSource(),buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.13),ctx.sampleRate),data=buffer.getChannelData(0);for(let j=0;j<data.length;j++)data[j]=(Math.random()*2-1)*Math.exp(-j/(ctx.sampleRate*.022));source.buffer=buffer;const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=900+Math.random()*1700;filter.Q.value=.6;source.connect(filter);filter.connect(master);source.start(ctx.currentTime+i*.035+Math.random()*.025);}
 setTimeout(()=>{if(applauseContext===ctx){ctx.close().catch(()=>{});applauseContext=null;}},big?1200:800);
 }catch{/* Sound availability never blocks learning. */}
}

function home(){const known=all().filter(w=>wordStatus(state.practice[w.id])==='Zelf onthouden').length;const active=state.lists;return `<section class="hero"><div><span class="eyebrow">Poek’s woordenclub · voor Lara</span><h1>Geluid aan.<br>Poek is er klaar voor.</h1><p>Eerst luisteren, dan kiezen, dan zelf typen.<br>Poek oefent alle woorden met je, in blokjes van tien.</p><button class="primary" id="start">▶ Spelen</button>${pausedRound?'<button id="resume">Verder met je spel →</button>':''}<p><small>Alle woorden · 10 per blok · fouten daarna opnieuw</small></p></div><div class="art"><span class="floating-block">♫</span><div class="platform"></div>${poek()}<span class="nametag">POEK <span>● klaar voor jou</span></span></div></section><div class="grid"><div class="card"><span class="icon">🎧</span><h3>Jouw missie</h3><p>1. Bekijk en beluister het woordpaar.<br>2. Kies de betekenis uit vier antwoorden.<br>3. Typ het Engelse woord.</p><small>${active.reduce((n,l)=>n+l.words.length,0)} woorden · ${esc(active.map(l=>l.name).join(' · ')||'Kies een lijst bij Ouders')}</small></div><div class="card"><span class="icon">★</span><h3>Zelf onthouden</h3><p><strong class="stat">${known}</strong> van ${all().length} woorden op 3 dagen zelf opgehaald</p><button data-page="progress">Mijn voortgang →</button></div><div class="card musicroom"><div class="home-collectible">${itemDrawing(state.studio.awards.length?giftType(state.studio.awards.at(-1),state.studio.awards):'headphones')}</div><h3>Poeks muziekstudio</h3><p>${state.studio.awards.length} cadeaus verdiend</p><small>Een cadeau na elk blok dat helemaal goed is, inclusief herhaling.</small><p><button data-page="studio">Naar de muziekstudio →</button></p></div></div><p class="notice">📅 Toets: ${examLabel()}. Elke dag een beetje oefenen helpt.<br>📖 De 34 woorden en uitdrukkingen uit je schoolfoto’s staan klaar. Lijsten aanpassen? Dat kan bij Ouders.</p>`;}
function examLabel(){return new Date((state.examDate||TEST_DATE)+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'long'});}
function studio(){const type=equippedType();return `<span class="eyebrow">Poekies magische backstage</span><h1>Jouw studio. Jouw Poekie.</h1><p>Pak je cadeaus uit en geef Poekie jouw favoriete look. Elk blok dat helemaal goed is, maakt de studio een beetje sprankelender.</p><section class="magic-stage"><span class="stage-star star-a">✧</span><span class="stage-star star-b">✧</span><span class="stage-star star-c">✦</span><div class="stage-lights"></div><div class="stage-pet">${poek()}</div>${type!=='base'?`<div class="stage-instrument">${itemDrawing(type)}</div>`:''}<div class="stage-plinth"></div><div class="pet-nameplate">POEKIE <span>jouw muziekmaatje</span></div></section><section class="wardrobe"><h2>De cadeaukamer</h2><div class="collection-grid">${state.studio.awards.map(g=>{const opened=state.studio.opened.includes(g.key),equipped=state.studio.equipped===g.key;return `<article class="collection-card ${equipped?'equipped':''}">${opened?itemDrawing(giftType(g,state.studio.awards)):giftBox()}<h3>${esc(g.name)}</h3>${!opened?`<button class="primary" data-open="${esc(g.key)}">Pak uit!</button>`:`<button data-equip="${esc(g.key)}" aria-pressed="${equipped}">${equipped?'✓ In jouw studio':'Gebruik in de studio'}</button>`}</article>`;}).join('')||'<article class="collection-card teaser">'+giftBox()+'<h3>Jouw eerste verrassing</h3><p>Oefen een blok helemaal goed. Dan mag je dit cadeau uitpakken!</p></article>'}</div></section><p class="notice">Hetzelfde blok geeft maximaal één cadeau per dag. Per dag zijn er maximaal ${Math.ceil(all().length/10)} ${all().length<=10?'cadeau':'cadeaus'} te verdienen. Je kunt altijd verder oefenen.</p><button class="primary" id="start">▶ Spelen</button>${pausedRound?'<button id="resume">Verder met je spel →</button>':''}`;}
function giftBox(){return '<svg class="gift-box" viewBox="0 0 220 190" aria-hidden="true"><ellipse cx="110" cy="173" rx="80" ry="12" fill="#a38ac4" opacity=".2"/><path d="M42 79h136v81H42z" fill="#ac82e8"/><path d="M178 79l20-14v80l-20 15z" fill="#8062bb"/><path d="M27 58h155v33H27z" fill="#c3a0f3"/><path d="M182 58l17-11v31l-17 13z" fill="#a781d6"/><path d="M27 58l20-11h152l-17 11z" fill="#e0c7ff"/><path d="M96 58h27v102H96z" fill="#ffe3a3"/><path d="M95 48q-51-53-45-7 9 21 45 7m23 0q52-53 46-7-9 21-46 7" fill="#ffdc91" stroke="#edbd68" stroke-width="5"/><path d="M110 36l10 17-10 12-12-12z" fill="#fff1bd"/><path d="M42 116l3 9 10 3-10 3-3 9-3-9-9-3 9-3m123-21l3 9 9 3-9 3-3 9-3-9-10-3 10-3" fill="#fff3c3"/></svg>';}
function progress(){const words=all(),practiced=words.filter(w=>(state.practice[w.id]?.goodPasses||0)>0).length,spread=words.filter(w=>practiceDays(state.practice[w.id])>=3).length,remembered=words.filter(w=>wordStatus(state.practice[w.id])==='Zelf onthouden').length,need=dueWords(state,words).filter(w=>!state.practice[w.id]||state.practice[w.id].due<=Date.now()||wordStatus(state.practice[w.id])==='Nog oefenen');
 return `<span class="eyebrow">Jouw route naar ${examLabel()}</span><h1>Wat blijft er al hangen?</h1><div class="grid"><div class="card"><h3>Goed geoefend</h3><strong class="stat">${practiced}/${words.length}</strong><p>minstens één keer kiezen én typen zonder fout in dezelfde poging</p></div><div class="card"><h3>Op meerdere dagen</h3><strong class="stat">${spread}/${words.length}</strong><p>goed geoefend of zelf opgehaald op minstens 3 verschillende dagen</p></div><div class="card"><h3>Zelf onthouden</h3><strong class="stat">${remembered}/${words.length}</strong><p>zonder voorbeeld opgehaald op 3 verschillende dagen</p></div></div><section class="card"><h2>Vandaag nog even herhalen</h2><p>${need.length} woorden zijn nieuw, lastig of aan een nieuwe herhaling toe.</p><p>${need.slice(0,10).map(w=>esc(w.nl)).join(' · ')||'Je hebt voor nu alles herhaald. Morgen verder mag ook!'}</p><div class="actions"><button class="primary" id="start">▶ Alle woorden oefenen</button><button id="self-check">Zonder voorbeeld testen</button></div><p><small>Begin op een volgende oefendag liefst met de zelfcheck, vóór de woordvoorbeelden. De zelfcheck vraagt alleen Nederlands → Engels, zonder vooraf het antwoord te tonen. Een goed antwoord telt voor onthouden vanaf 20 uur na een voorbeeld en op 3 verschillende dagen. Een directe herhaling blijft extra oefening.</small></p></section>${progressTable()}<button data-page="home">Terug naar de club</button>`;}
function progressTable(parent=false){return state.lists.map(l=>`<section class="card section"><h2>${esc(l.name)}</h2><div class="scroll"><table><thead><tr><th>Woord</th><th>Goed geoefend</th><th>Verschillende dagen</th><th>Zelfcheck</th><th>Volgende stap</th></tr></thead><tbody>${l.words.map(w=>{const p=state.practice[w.id];return `<tr><td><strong>${esc(parent?w.en:w.nl)}</strong>${parent?'<br>'+esc(w.nl):''}</td><td>${p?.goodPasses||0} keer${parent?`<br><small>${p?.passes||0} pogingen totaal</small>`:''}</td><td>${Math.min(3,practiceDays(p))}/3 dagen</td><td>${p?.recallDays.length||0}/3 dagen</td><td>${wordStatus(p)}<br><small>${!p?'Begin met oefenen':p.due<=Date.now()?'Nu herhalen':'Herhalen: '+new Date(p.due).toLocaleDateString('nl-NL',{timeZone:'Europe/Amsterdam',day:'numeric',month:'short'})}</small></td></tr>`;}).join('')}</tbody></table></div></section>`).join('');}
function startSelfCheck(){if(!all().length)return;cleanup();round={mode:'check',words:dueWords(state,all()).slice(0,10),index:0,id:uid(),phase:'question',count:0,correct:0};page='exercise';render();}
function selfCheckScreen(){if(round.phase==='end')return `<section class="exercise"><div class="card"><h1>Zelfcheck klaar!</h1><p>${round.correct} van ${round.count} antwoorden zonder hulp goed.</p><p>In Mijn voortgang zie je welke antwoorden ook op een nieuwe dag meetelden.</p><button data-page="progress">Mijn voortgang</button></div></section>`;const w=currentWord();return `<section class="exercise"><div class="row between"><span class="tag">Zelfcheck ${round.index+1}/${round.words.length}</span><button id="stop">Stoppen</button></div><div class="card"><h2>Wat is dit in het Engels?</h2><div class="word">${esc(w.nl)}</div>${round.phase==='question'?'<form id="self-form"><label for="answer">Jouw Engelse antwoord</label><input maxlength="250" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="actions"><button class="primary" type="submit">Controleer</button><button id="self-hint" type="button">Ik weet het nog niet</button></div></form>':`<div class="feedback" role="status">${round.message}</div>${answerComparison()}<button id="self-next" class="primary" disabled>Volgende →</button>`}</div></section>`;}
function checkRecall(help=false){if(round?.mode!=='check'||round.phase!=='question')return;const input=document.querySelector('#answer').value;if(!help&&!input.trim())return;const w=currentWord(),correct=!help&&assess(w,'nl-en',input)==='correct';round.typedAnswer=input;round.answerCorrect=correct;const {counted}=logCheck(state,w.id,correct,help);round.count++;if(correct)round.correct++;round.message=correct?(counted?'✓ Zelf opgehaald! Deze nieuwe oefendag telt mee.':'✓ Goed! Dit is extra oefening; probeer het morgen weer zonder voorbeeld.'):'Nog even oefenen. Bekijk het goede antwoord en probeer het later nog eens.';round.phase='feedback';save();render();armButton('self-next');if(correct)celebrate();}
function giftCard(){if(!round.gift)return `<p class="notice">✓ Dit blok is 100% goed afgerond. Je cadeau voor dit blok is vandaag al verdiend, of je dagelijkse collectie is compleet.</p>`;const opened=state.studio.opened.includes(round.gift.key);return `<section class="gift-card magic-gift" role="status"><span class="eyebrow">100% goed · speciaal voor Poekie</span><h2>${opened?'Een nieuwe look voor jouw muziekmaatje!':'Er staat een verrassing voor je klaar!'}</h2>${opened?`<div class="gift-preview">${poek()}${itemDrawing(giftType(round.gift,state.studio.awards))}</div><p>${esc(round.gift.name)} is nu van jou.</p><button data-page="studio">Naar mijn studio</button>`:`${giftBox()}<p>Je hebt alle woorden goed geoefend. Wat zou erin zitten?</p><button class="primary" data-open="${esc(round.gift.key)}">Pak je cadeau uit ✦</button>`}</section>`;}
function resume(){if(!pausedRound)return;cleanup();round=pausedRound;pausedRound=null;page='exercise';render();if(round.phase==='choice-ok')armButton('to-type');if(round.phase==='type-feedback')armButton('next');if(round.mode==='check'&&round.phase==='feedback')armButton('self-next');}
function currentWord(){return round.words[round.index];}
function start(){pausedRound=null;if(!all().length){alert('Voeg eerst woorden toe bij Ouders.');return;}round={...createGame(all()),id:uid(),done:0};page='exercise';render();}
function audioButtons(){return `<div class="actions"><button class="listen-button" id="listen">🔊 Luister</button><button id="slow">🐢 Langzamer</button></div><p id="audio-status" class="muted" role="status">Luister het hele woord af. Daarna gaat Verder aan.</p>`;}
function exercise(){
 if(round.phase==='end')return endScreen();
 if(round.phase==='review-ready')return `<section class="exercise"><div class="card"><div class="mini-poek">${poek()}</div><span class="eyebrow">Blok afgerond</span><h1>Even opnieuw, samen.</h1><p>Nog ${round.mistakes.length} woorden om dit blok helemaal goed af te ronden. We herhalen alleen wat nog lastig is.</p><p>We doen weer: luisteren → kiezen → typen.</p><button class="primary" id="review">Foute woorden opnieuw →</button><button id="stop">Stoppen</button></div></section>`;
 if(round.phase==='block-end')return `<section class="exercise"><div class="card"><div class="mini-poek">${poek()}</div><h1>Dit blok is helemaal goed!</h1>${giftCard()}<p>${round.completed} van ${round.deck.length} woorden gedaan. ${round.deck.length-round.completed} woorden staan nog klaar.</p><button class="primary" id="next-block">Volgende ${Math.min(10,round.deck.length-round.completed)} woorden →</button><button id="stop">Stoppen</button></div></section>`;
 const w=currentWord(),phase=round.phase;
 if(phase==='choice'&&!round.options)round.options=choicesFor(w,[...all(),...pairs.map(([en,nl,...alts])=>({en,nl,alts}))]);
 let content='';
 if(phase==='learn')content=`<h2>Bekijk het woord en luister.</h2>${phraseTip(w)}<div class="word-pair"><div><small>Engels</small><div class="word">${esc(w.en)}</div></div><span aria-hidden="true">↔</span><div><small>Nederlands</small><div class="word">${esc(w.nl)}</div></div></div>${audioButtons()}<button class="primary" id="learned" ${round.audioComplete||round.audioBypassed?'':'disabled'}>Verder →</button><button class="text-button" id="audio-skip" ${round.audioFailed?'':'hidden'}>Ouder: geluid werkt niet</button>`;
 else if(phase==='choice')content=`<h2>Wat betekent dit?</h2><div class="word">${esc(w.en)}</div><p>Kies het juiste Nederlandse antwoord.</p><div class="choices" role="group" aria-label="Vier Nederlandse antwoorden">${round.options.map((v,i)=>`<button class="choice" data-choice="${i}" ${round.triedChoices.includes(i)?'disabled':''}><span>${String.fromCharCode(65+i)}</span>${esc(v)}</button>`).join('')}</div><p id="choice-status" class="choice-status" role="status">${round.choiceFailed?'Nog niet. Probeer een ander antwoord.':''}</p>`;
 else if(phase==='choice-ok')content=`<h2>✓ Dat is de juiste betekenis!</h2><div class="word">${esc(w.en)} = ${esc(w.nl)}</div><button class="primary" id="to-type" disabled>Nu zelf typen →</button>`;
 else if(phase==='type')content=`<h2>Hoe schrijf je dit in het Engels?</h2><div class="word">${esc(w.nl)}</div>${phraseTip(w)}<form id="answer-form"><label for="answer">Typ het Engelse woord</label><input maxlength="250" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Jouw Engelse antwoord…"><div class="actions"><button class="primary" type="submit">Controleer</button><button type="button" id="hint">Ik weet het nog niet</button></div></form>`;
 else if(phase==='type-feedback')content=`<h2>${round.result==='correct'?'✓ Goed getypt!':'We oefenen dit straks nog eens.'}</h2><div class="feedback" role="status">${round.message}</div>${answerComparison()}<button class="primary" id="next" disabled>${round.index+1<round.words.length?'Volgend woord':'Blok afronden'} →</button>`;
 const step=phase==='learn'?1:phase.startsWith('choice')?2:3;
 return `<section class="exercise"><div class="row between"><span class="tag">${round.repeat?'🔁 Herhalen':'🎮 Woord'} ${round.index+1} van ${round.words.length} · totaal ${round.completed}/${round.deck.length}</span><button id="stop">Stoppen</button></div><div class="steps" aria-label="Stap ${step} van 3"><span class="${step===1?'current':''}">1. Luisteren</span><span class="${step===2?'current':''}">2. Kiezen</span><span class="${step===3?'current':''}">3. Typen</span></div><div class="card">${content}</div><p class="muted">🐱 Poek zegt: “Rustig aan. We doen het samen.”</p></section>`;
}
function endScreen(){return `<section class="exercise"><div class="card"><div class="mini-poek">${poek()}</div><span class="eyebrow">${round.stopped?'Pauze':'Klaar voor nu'}</span><h1>Goed geoefend, Lara!</h1>${!round.stopped&&round.blockClean?giftCard():''}<p>${round.completed} van ${round.deck.length} woorden gedaan.<br>${round.reviewed} woorden nog eens herhaald.</p><p>Dit was oefenen met voorbeelden. Poek bewaart wat je hebt geoefend.</p><div class="actions"><button class="primary" data-page="home">Terug naar de club</button><button id="reward">♫ Speel een muziekje</button></div></div></section>`;}
function practiceRecord(skill,correct){const w=currentWord();record(state,w.id,skill,correct?'correct':'wrong',true,round.id);const p=state.progress[w.id+':'+skill];p.lastResult=correct?'practice-correct':'practice-wrong';if(!correct)p.wrong++;save();}
function selectChoice(index){if(round?.phase!=='choice'||round.triedChoices.includes(index))return;const correct=round.options[index]===currentWord().nl;practiceRecord('guided-choice',correct);if(!correct){round.wordFailed=true;round.choiceFailed=true;round.triedChoices.push(index);render();return;}cleanup();round.phase='choice-ok';render();armButton('to-type');celebrate();}
function check(hint=false){if(round?.phase!=='type')return;const input=document.querySelector('#answer')?.value||'';if(!hint&&!input.trim())return;const w=currentWord(),result=hint?'wrong':assess(w,'nl-en',input);round.result=result;round.typedAnswer=input;const correct=result==='correct';practiceRecord('guided-english',correct);if(!correct)round.wordFailed=true;
 round.message=correct?'Dat is het Engelse woord. Goed geoefend!':result==='typo'?'Je bedoelt waarschijnlijk het juiste woord. Kijk nog eens naar de spelling.':hint?'We kijken samen naar het Engelse woord.':'Nog niet helemaal. Bekijk het Engelse woord hieronder.';
 cleanup();round.phase='type-feedback';render();armButton('next');if(correct)celebrate();}
function armButton(id){const current=round,phase=round.phase,index=round.index;feedbackTimer=setTimeout(()=>{if(round!==current||round.phase!==phase||round.index!==index)return;const b=document.getElementById(id);if(b)b.disabled=false;},450);}
function finish(){if(round?.mode==='check'){cleanup();round.phase='end';render();return;}if(!round||round.phase==='end')return;cleanup();round.stopped=true;round.phase='end';rewardDay();render();}
function rewardDay(){const day=new Date().toISOString().slice(0,10);if(round.completed>=4&&!state.rewards.includes(day))state.rewards.push(day);save();}
function wordDone(){cleanup();logPass(state,currentWord().id,!round.wordFailed);round.done++;completeWord(round);if(round.blockClean)round.gift=awardBlock(state,round);save();if(round.phase==='end')rewardDay();render();window.scrollTo(0,0);}
function parents(){return `<span class="eyebrow">Voor ouders</span><h1>Lara’s woordenclub</h1><p>Alles staat alleen in deze browser. Exporteer regelmatig een back-up, zeker voordat je browsergegevens wist of van apparaat wisselt. Het oudergedeelte heeft geen pincode.</p><div class="row"><button id="export">↓ Back-up exporteren</button><label>Back-up herstellen <input type="file" id="restore" accept="application/json,.json"></label></div><p class="notice">Herstellen vervangt de huidige gegevens, na bevestiging. CSV-import hieronder voegt een lijst toe en houdt bestaande voortgang intact.</p><section class="card section"><h2>Stem en feestjes</h2><p>We kiezen een lichte Engelse stem en een hogere toon. Een echte kinderstem is niet op ieder apparaat beschikbaar. Welke stemmen je kunt kiezen, hangt af van de iPhone of computer.</p><label for="voice-select">Engelse stem</label><select id="voice-select"></select><label for="voice-pitch">Toonhoogte (1 tot 1,6)</label><input id="voice-pitch" type="range" min="1" max="1.6" step="0.1" value="${state.voice.pitch}"><button id="voice-preview">Luister naar deze stem</button><p id="audio-status" role="status"></p><label><input class="check" id="confetti-setting" type="checkbox" ${state.effects.confetti?'checked':''}> Confetti bij goede antwoorden</label><p>Applaus zet je bovenaan aan of uit. Uitspraak heeft altijd een eigen luisterknop.</p></section><section class="card section"><label for="exam-date">Toetsdatum voor het oefenplan</label><input type="date" id="exam-date" value="${esc(state.examDate)}"></section><section class="card section"><h2>Woordenlijsten</h2><p>Bij spelen doen alle woorden uit alle lijsten mee.</p>${state.lists.map(l=>`<div class="listitem row between"><strong>${esc(l.name)} (${l.words.length})</strong><button data-edit="${esc(l.id)}">Bewerken</button></div>`).join('')}</section><section class="card section"><h2 id="editor-title">Lijst toevoegen of aanpassen</h2><label for="list-name">Naam</label><input id="list-name" placeholder="Bijvoorbeeld: Unit 2"><label for="test-date">Toetsdatum (optioneel)</label><input type="date" id="test-date"><label for="pairs">Engels, Nederlands, Nederlandse alternatieven, Engelse alternatieven</label><p><small>Eén woordpaar per regel. Scheid kolommen met komma, puntkomma of tab; alternatieven met |. Bij komma’s in een veld: zet het veld tussen dubbele aanhalingstekens. Een optionele kopregel mag.</small></p><textarea id="pairs" placeholder="cat,kat,poes&#10;music,muziek"></textarea><label for="csv">Of importeer een CSV-bestand</label><input id="csv" type="file" accept=".csv,text/csv"><div class="actions"><button id="preview">Controlevoorbeeld bekijken</button><button id="new-list">Nieuwe lijst</button></div><div id="preview-box" aria-live="polite"></div></section><section class="section"><h2>Voortgang per vaardigheid</h2><p>Alle woorden doen mee, in blokken van tien. Eerst luisteren bij het woordpaar, dan de betekenis kiezen uit vier mogelijkheden, dan Engels typen. Foute woorden worden herhaald tot kiezen én typen in een nieuwe poging helemaal goed zijn. Daarna krijgt Lara een studiocadeau en kan ze door. Stoppen mag altijd. Dit is begeleid oefenen; voorbeelden en multiplechoice tellen niet als zelfstandige beheersing. Oude resultaten blijven in de back-up behouden.</p><p>Eerdere versies bewaarden alleen pogingen per vaardigheid. Die blijven behouden in de back-up; we verzinnen daar geen foutloze woordrondes of oefendagen bij.</p>${progressTable(true)}</section>`;}
function bind(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
 document.querySelector('.brand').onclick=e=>{e.preventDefault();go('home');};
 const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
 const effectButton=document.querySelector('#effects-toggle');if(effectButton){effectButton.textContent=state.effects.sound?'♪ Applaus aan':'♪ Applaus uit';effectButton.setAttribute('aria-pressed',String(state.effects.sound));effectButton.onclick=()=>{state.effects.sound=!state.effects.sound;stopParty();save();effectButton.textContent=state.effects.sound?'♪ Applaus aan':'♪ Applaus uit';effectButton.setAttribute('aria-pressed',String(state.effects.sound));};}
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGift(b.dataset.open));document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{if(!state.studio.opened.includes(b.dataset.equip))return;state.studio.equipped=b.dataset.equip;save();render();});
 voiceOptions();const vs=document.querySelector('#voice-select');if(vs)vs.onchange=()=>{state.voice.uri=vs.value;save();};on('voice-preview',()=>speak('Hello Lara! Let us learn English together.'));const pitch=document.querySelector('#voice-pitch');if(pitch)pitch.onchange=()=>{state.voice.pitch=Number(pitch.value);save();};const motion=document.querySelector('#confetti-setting');if(motion)motion.onchange=()=>{state.effects.confetti=motion.checked;save();};

 on('self-check',startSelfCheck);on('self-hint',()=>checkRecall(true));const sf=document.querySelector('#self-form');if(sf)sf.onsubmit=e=>{e.preventDefault();checkRecall();};on('self-next',e=>{if(e.detail>1||round?.mode!=='check'||round.phase!=='feedback')return;cleanup();round.index++;round.phase=round.index>=round.words.length?'end':'question';render();});
 on('resume',resume);on('start',start);on('stop',finish);on('listen',()=>speak(currentWord().en));on('slow',()=>speak(currentWord().en,true));
 const toChoice=e=>{if(e.detail>1||round?.phase!=='learn'||(!round.audioComplete&&!round.audioBypassed))return;cleanup();round.phase='choice';render();};
 on('learned',toChoice);on('audio-skip',e=>{if(!round?.audioFailed)return;if(confirm('Werkt het voorlezen echt niet? Als ouder kun je deze luisterstap overslaan.')){round.audioBypassed=true;toChoice(e);}});
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=e=>{if(e.detail>1)return;selectChoice(Number(b.dataset.choice));});
 on('to-type',e=>{if(e.detail>1||round?.phase!=='choice-ok')return;cleanup();round.phase='type';render();document.querySelector('#answer')?.focus();});
 on('hint',()=>check(true));const form=document.querySelector('#answer-form');if(form)form.onsubmit=e=>{e.preventDefault();check();};
 on('next',e=>{if(e.detail>1||round?.phase!=='type-feedback')return;wordDone();});
 on('review',e=>{if(e.detail>1||round?.phase!=='review-ready')return;cleanup();beginReview(round);render();});
 on('next-block',e=>{if(e.detail>1||round?.phase!=='block-end')return;cleanup();nextBlock(round);render();});
 on('reward',()=>{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;try{cleanup();const ctx=new Audio();ctx.resume();[261.63,329.63,392,523.25].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.045,ctx.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.18+.3);o.start(ctx.currentTime+i*.18);o.stop(ctx.currentTime+i*.18+.31);});setTimeout(()=>ctx.close(),1300);}catch{}});
const ed=document.querySelector('#exam-date');if(ed)ed.onchange=()=>{if(ed.value){state.examDate=ed.value;save();}};on('preview',preview);on('new-list',()=>{editId=null;go('parents');});document.querySelectorAll('[data-active]').forEach(e=>e.onchange=()=>{state.lists.find(l=>l.id===e.dataset.active).active=e.checked;save();});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>{editId=e.dataset.edit;const l=state.lists.find(l=>l.id===editId);document.querySelector('#list-name').value=l.name;document.querySelector('#test-date').value=l.date;document.querySelector('#pairs').value=l.words.map(w=>[w.en,w.nl,w.alts.join('|'),(w.enAlts||[]).join('|')].map(v=>'"'+v.replaceAll('"','""')+'"').join(',')).join('\n');document.querySelector('#editor-title').textContent='Bewerken: '+l.name;document.querySelector('#editor-title').scrollIntoView();});const csv=document.querySelector('#csv');if(csv)csv.onchange=async()=>{if(csv.files[0])document.querySelector('#pairs').value=await csv.files[0].text();};on('export',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='poek-woordenclub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});const restore=document.querySelector('#restore');if(restore)restore.onchange=async()=>{try{const data=JSON.parse(await restore.files[0].text());validateBackup(data);if(confirm('Huidige lijsten en voortgang vervangen door deze back-up? Exporteer eerst als je die wilt bewaren.')){state=initExtras(data);save();render();}}catch{alert('Dit is geen geldige Lara-back-up. Er is niets gewijzigd.');}};}
function preview(){const box=document.querySelector('#preview-box');try{const words=parsePairs(document.querySelector('#pairs').value),name=document.querySelector('#list-name').value.trim(),errors=validateWords(words);if(!name)errors.unshift('Geef de lijst een naam.');if(!words.length)errors.push('Voeg minstens één woordpaar toe.');if(errors.length){box.innerHTML='<p class="error">'+errors.map(esc).join('<br>')+'</p>';return;}draft={name,date:document.querySelector('#test-date').value,words};box.innerHTML=`<h3>Controleer ${words.length} woorden</h3><div class="scroll"><table><tr><th>Engels</th><th>Nederlands</th><th>Alternatieven NL / EN</th></tr>${words.map(w=>`<tr><td>${esc(w.en)}</td><td>${esc(w.nl)}</td><td>${esc(w.alts.join(', '))} / ${esc(w.enAlts.join(', '))}</td></tr>`).join('')}</table></div><button class="primary" id="save-list">Deze lijst opslaan</button>`;document.querySelector('#save-list').onclick=()=>{const old=state.lists.find(l=>l.id===editId);const words=draft.words.map(w=>({...w,id:old?.words.find(o=>o.en===w.en)?.id||uid()}));if(old)Object.assign(old,{...draft,words});else state.lists.push({...draft,words,id:uid(),active:true});save();editId=null;render();};}catch(e){box.innerHTML='<p class="error">'+esc(e.message)+'</p>';}}
function validateBackup(d){if(d.studio?.opened!=null&&(!Array.isArray(d.studio.opened)||!d.studio.opened.every(k=>typeof k==='string')))throw Error();if(d.studio?.equipped!=null&&typeof d.studio.equipped!=='string')throw Error();if(d.effects!=null&&(typeof d.effects.sound!=='boolean'||typeof d.effects.confetti!=='boolean'))throw Error();if(d.voice!=null&&(typeof d.voice.uri!=='string'||!Number.isFinite(d.voice.pitch)))throw Error();if(d.practice!=null){if(typeof d.practice!=='object'||Array.isArray(d.practice))throw Error();for(const p of Object.values(d.practice)){if(!Number.isFinite(p.passes)||!Number.isFinite(p.goodPasses)||!Array.isArray(p.cleanDays)||!Array.isArray(p.recallDays)||!p.cleanDays.concat(p.recallDays).every(x=>typeof x==='string'))throw Error();}}if(d.studio!=null&&(!Array.isArray(d.studio.awards)||!d.studio.awards.every(g=>typeof g.key==='string'&&typeof g.day==='string'&&typeof g.icon==='string'&&typeof g.name==='string'&&Array.isArray(g.wordIds))))throw Error();if(d.examDate!=null&&!/^\d{4}-\d{2}-\d{2}$/.test(d.examDate))throw Error();if(d.version!==1||!Array.isArray(d.lists)||!d.progress||!Array.isArray(d.rewards))throw Error();const ids=new Set();for(const l of d.lists){if(typeof l.id!=='string'||typeof l.name!=='string'||!Array.isArray(l.words)||typeof l.active!=='boolean')throw Error();for(const w of l.words){if(typeof w.id!=='string'||ids.has(w.id)||typeof w.en!=='string'||typeof w.nl!=='string'||!Array.isArray(w.alts)||!w.alts.every(x=>typeof x==='string')||(w.enAlts&&!w.enAlts.every(x=>typeof x==='string')))throw Error();ids.add(w.id);}}for(const p of Object.values(d.progress)){if(!Array.isArray(p.days)||!Array.isArray(p.sessions)||!Number.isFinite(p.due)||!Number.isFinite(p.attempts))throw Error();}}
