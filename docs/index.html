['afraid','bang'],['belt','riem'],['big','groot'],['blond','blond'],['blouse','blouse','shirt'],['braid','vlecht'],['colour','kleur'],['curly','gekruld','krullerig'],['dark','donker'],['friendly','vriendelijk'],['funny','grappig'],['glasses','bril'],['handsome','knap'],['long','lang'],['nice','aardig'],['ponytail','paardenstaart'],['pretty','mooi','knap'],['sad','verdrietig','bedroefd'],['scarf','sjaal'],['short','kort'],['shy','verlegen'],['small','klein'],['sporty','sportief'],['straight','steil'],['tall','lang (lichaam)','lang'],['to get dressed','zich aankleden','aankleden'],['to wear','dragen'],['What colour ...?','Welke kleur ...?','welke kleur'],['What does ... look like?','Hoe ziet ... eruit?'],['What is ... like?','Hoe is ...?'],['cartoon','striptekening'],['feature','kenmerk','kenmerken'],['self-portrait','zelfportret'],['to inherit','erven']
];
function initial(){return {version:1,lists:[{id:'school-unit1',name:'Unit 1 · Dit ben ik',date:'',active:true,words:pairs.map(([en,nl,...alts],i)=>({id:'school-'+i,en,nl,alts,enAlts:[]}))}],progress:{},rewards:[],music:false};}

const skills=['listen'];
const normalize=s=>s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[?.!]+$/,'').trim();
function distance(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]!==b[j-1]));prev=old;}}return row[b.length];}
function assess(word,skill,input){const answers=((skill==='en-nl'||skill==='listen')?[word.nl,...word.alts]:[word.en,...(word.enAlts||[])]).map(normalize);const value=normalize(input);if(answers.includes(value))return 'correct';if(value.length>=4&&answers.some(a=>distance(value,a)===1))return 'typo';return 'wrong';}
function record(state,id,skill,result,help,session,now=Date.now()){
 const key=id+':'+skill;const p=state.progress[key]||{days:[],sessions:[],attempts:0,helped:0,wrong:0};p.attempts++;p.last=now;
 if(result==='typo')p.recognized=(p.recognized||0)+1;
 if(skill==='speech'){p.practiced=(p.practiced||0)+1;p.due=now+86400000;}
 else if((result==='correct'||((skill==='en-nl'||skill==='listen')&&result==='typo'))&&!help){const day=new Date(now).toISOString().slice(0,10);if(!p.days.includes(day)&&!p.sessions.includes(session)){p.days.push(day);p.sessions.push(session);}p.due=now+[1,3,7,14][Math.min(p.days.length-1,3)]*86400000;p.lastResult='independent';}
 else{if(help)p.helped++;else p.wrong++;p.lastResult=help?'helped':'practice';p.due=now+60000;}
 state.progress[key]=p;return p;
}
function status(p){return !p?'Nieuw':p.days.length>=3?'Onthouden!':p.days.length>=2?'Lukt al':'Ik oefen';}
function mastered(state,id){return (state.progress[id+':listen']?.days.length||0)>=3;}
function queue(state,now=Date.now()){
 const words=state.lists.filter(l=>l.active).flatMap(l=>l.words);
 return words.map(word=>({word,skill:'listen',p:state.progress[word.id+':listen']}))
 .sort((a,b)=>{const rank=t=>!t.p?1:t.p.due<=now?0:2;return rank(a)-rank(b)||(a.p?.due||0)-(b.p?.due||0);}).slice(0,8);
}
function parsePairs(text){const rows=[];let field='',row=[],quoted=false;const delimiter=text.includes('\t')?'\t':text.includes(';')?';':',';for(let i=0;i<=text.length;i++){const c=text[i]??'\n';if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(!quoted&&(c===delimiter||c==='\n')){row.push(field.trim());field='';if(c==='\n'){if(row.some(Boolean))rows.push(row);row=[];}}else if(c!=='\r')field+=c;}if(quoted)throw Error('Een aanhalingsteken is niet afgesloten.');if(rows[0]&&/^(engels|english|en)$/i.test(rows[0][0]))rows.shift();return rows.map(r=>({en:r[0]||'',nl:r[1]||'',alts:(r[2]||'').split('|').map(s=>s.trim()).filter(Boolean),enAlts:(r[3]||'').split('|').map(s=>s.trim()).filter(Boolean)}));}
function validateWords(words){const seen=new Set();return words.flatMap((w,i)=>{const errors=[];if(!w.en||!w.nl)errors.push(`Regel ${i+1}: Engels of Nederlands ontbreekt.`);if(seen.has(normalize(w.en)))errors.push(`Regel ${i+1}: dubbel Engels woord (${w.en}).`);seen.add(normalize(w.en));return errors;});}

function shuffled(values,rng=Math.random){const out=[...values];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function createGame(words,rng=Math.random){const deck=shuffled(words,rng);return {deck,offset:0,words:deck.slice(0,10),index:0,phase:'learn',repeat:false,mistakes:[],completed:0,reviewed:0,wordFailed:false,choiceFailed:false,englishHelp:false,listened:false,attemptedAudio:false,correct:0,options:null,triedChoices:[],retryMistakes:[],blockClean:false};}
function choicesFor(word,words,rng=Math.random){
 const accepted=new Set([word.nl,...word.alts].map(normalize));
 const distractors=[...new Map(words.filter(w=>![w.nl,...w.alts].some(x=>accepted.has(normalize(x)))).map(w=>[normalize(w.nl),w.nl])).values()];
 // For short parent-created lists, use real translations from the supplied school list as fallback.
 return shuffled([word.nl,...shuffled(distractors,rng).slice(0,3)],rng);
}
function completeWord(game){
 const word=game.words[game.index];
 if(!game.repeat){game.completed++;if(game.wordFailed&&!game.mistakes.some(w=>w.id===word.id))game.mistakes.push(word);}
 else{game.reviewed++;if(game.wordFailed&&!game.retryMistakes.some(w=>w.id===word.id))game.retryMistakes.push(word);}
 game.index++;
 if(game.index<game.words.length){game.phase='learn';resetWord(game);return;}
 const pending=game.repeat?game.retryMistakes:game.mistakes;
 if(pending.length){game.mistakes=[...pending];game.phase='review-ready';}
 else{game.blockClean=true;game.phase=game.offset+10<game.deck.length?'block-end':'end';}
}
function beginReview(game){game.words=[...game.mistakes];game.index=0;game.repeat=true;game.retryMistakes=[];game.phase='learn';resetWord(game);}
function nextBlock(game){game.offset+=10;game.words=game.deck.slice(game.offset,game.offset+10);game.index=0;game.repeat=false;game.mistakes=[];game.retryMistakes=[];game.blockClean=false;game.gift=null;game.phase='learn';resetWord(game);}
function resetWord(game){game.wordFailed=false;game.choiceFailed=false;game.englishHelp=false;game.listened=false;game.attemptedAudio=false;game.options=null;game.triedChoices=[];}

const TEST_DATE='2026-11-06';
const dayKey=(now=Date.now())=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(now));
const gifts=[['🎧','Poeks koptelefoon'],['🎸','Paarse gitaar'],['🔊','Studiospeakers'],['🥁','Drumstel'],['🎹','Keyboard'],['🪩','Discobal'],['💿','Platenverzameling'],['💡','Podiumlamp'],['🎼','Muziekstandaard'],['⭐','Sterrenposter'],['🎷','Saxofoon'],['🛋️','Chillbank']];
function initExtras(state){state.practice??={};state.studio??={awards:[]};state.examDate??=state.lists.find(l=>l.id==='school-unit1')?.date||TEST_DATE;return state;}
function logPass(state,id,clean,now=Date.now()){
 initExtras(state);const p=state.practice[id]??={passes:0,goodPasses:0,cleanDays:[],recallDays:[]};
 p.passes++;p.lastPassClean=clean;p.lastExample=now;if(!clean&&p.recallDays.length)p.needsRecall=true;
 if(clean){p.goodPasses++;const day=dayKey(now);if(!p.cleanDays.includes(day))p.cleanDays.push(day);}
 p.due=now+86400000;state.practice[id]=p;return p;
}
function logCheck(state,id,correct,help=false,now=Date.now()){
 initExtras(state);const p=state.practice[id]??={passes:0,goodPasses:0,cleanDays:[],recallDays:[]};
 p.checks=(p.checks||0)+1;p.lastCheck=correct&&!help;p.lastCheckAt=now;
 // Delayed recall, not copying a just-seen example, counts towards retention.
 const delayed=(!p.lastExample||now-p.lastExample>=20*3600000)&&(!p.lastRecall||now-p.lastRecall>=20*3600000);
 if(correct&&!help&&delayed){p.needsRecall=false;const day=dayKey(now);if(!p.recallDays.includes(day)){p.recallDays.push(day);p.lastRecall=now;}}
 else if(!correct||help){p.lastExample=now;p.needsRecall=true;}
 p.due=now+(correct&&!help?Math.min(3,p.recallDays.length||1)*86400000:3600000);state.practice[id]=p;
 return {p,counted:correct&&!help&&delayed};
}
function practiceDays(p){return p?new Set([...p.cleanDays,...p.recallDays]).size:0;}
function wordStatus(p){if(!p)return 'Nog beginnen';if((p.needsRecall||p.lastCheck===false)||(p.lastPassClean===false&&(p.lastExample||0)>(p.lastCheckAt||0)))return 'Nog oefenen';if(p.recallDays.length>=3)return 'Zelf onthouden';if(p.recallDays.length)return `Zelf gecheckt op ${p.recallDays.length}/3 dagen`;return `Goed geoefend op ${p.cleanDays.length}/3 dagen`;}
function dueWords(state,words,now=Date.now()){return [...words].sort((a,b)=>{const rank=w=>{const p=state.practice?.[w.id];return !p?0:wordStatus(p)==='Nog oefenen'?1:p.due<=now?2:3;};return rank(a)-rank(b)||(state.practice?.[a.id]?.due||0)-(state.practice?.[b.id]?.due||0);});}
function awardBlock(state,game,now=Date.now()){
 initExtras(state);if(!game.blockClean)return null;
 const ids=game.deck.slice(game.offset,game.offset+10).map(w=>w.id).sort();const day=dayKey(now),key=JSON.stringify([day,ids]);
 if(state.studio.awards.some(a=>a.key===key))return null;
 // A finite daily collection: replaying or reshuffling cannot farm endless gifts.
 if(state.studio.awards.filter(a=>a.day===day).length>=Math.ceil(game.deck.length/10))return null;
 const n=state.studio.awards.length,[icon,name]=gifts[n]||['⭐',`Muziekster ${n-gifts.length+1}`];
 const gift={key,day,icon,name,wordIds:ids,at:now};state.studio.awards.push(gift);return gift;
}

// Keep the original key so this update preserves existing lists and results.
const KEY='lara-woordentuin-v1',app=document.querySelector('#app');
let state,storageError=false;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved)validateBackup(saved);state=saved||initial();}catch{state=initial();storageError=true;}
initExtras(state);
let pausedRound=null;
let page='home',round=null,draft=null,editId=null,audioTimer=null,utterance=null,audioGeneration=0,feedbackTimer=null;
const uid=()=>globalThis.crypto?.randomUUID?.()||'poek-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>state.lists.flatMap(l=>l.words);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch{storageError=true;return false;}}
function audioMessage(text){const el=document.querySelector('#audio-status');if(el)el.textContent=text;}
function cleanup(){clearTimeout(audioTimer);clearTimeout(feedbackTimer);audioGeneration++;utterance=null;try{window.speechSynthesis?.cancel();}catch{}}
function speak(text,slow=false){
 if(round){round.attemptedAudio=true;const b=document.querySelector('#learned');if(b)b.disabled=false;}
 // Keep speech references alive (Safari), cancel stalled audio, and ignore late callbacks.
 const token=++audioGeneration;clearTimeout(audioTimer);utterance=null;
 const fail=()=>{if(token!==audioGeneration)return;clearTimeout(audioTimer);utterance=null;audioMessage('Geen geluid? Probeer opnieuw, je mag ook op “Verder” drukken. Het voorbeeld blijft beschikbaar.');};
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){fail();return;}
 try{
  const synth=window.speechSynthesis;synth.cancel();synth.resume();
  const u=new SpeechSynthesisUtterance(text);utterance=u;u.lang='en-GB';u.rate=slow?.65:.85;
  const voices=synth.getVoices();u.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;
  u.onstart=()=>{if(token!==audioGeneration)return;if(round)round.listened=true;audioMessage('Luister maar…');};
  u.onend=()=>{if(token!==audioGeneration)return;clearTimeout(audioTimer);utterance=null;audioMessage('Je mag nog een keer luisteren.');};
  u.onerror=fail;audioMessage('Het geluid wordt gestart…');synth.speak(u);
  audioTimer=setTimeout(()=>{if(token!==audioGeneration)return;fail();audioGeneration++;try{synth.cancel();}catch{}},10000);
 }catch{fail();}

 on('next-block',e=>{if(e.detail>1||round?.phase!=='block-end')return;cleanup();nextBlock(round);render();});
 on('reward',()=>{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;try{cleanup();const ctx=new Audio();ctx.resume();[261.63,329.63,392,523.25].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.045,ctx.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.18+.3);o.start(ctx.currentTime+i*.18);o.stop(ctx.currentTime+i*.18+.31);});setTimeout(()=>ctx.close(),1300);}catch{}});
const ed=document.querySelector('#exam-date');if(ed)ed.onchange=()=>{if(ed.value){state.examDate=ed.value;save();}};on('preview',preview);on('new-list',()=>{editId=null;go('parents');});document.querySelectorAll('[data-active]').forEach(e=>e.onchange=()=>{state.lists.find(l=>l.id===e.dataset.active).active=e.checked;save();});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>{editId=e.dataset.edit;const l=state.lists.find(l=>l.id===editId);document.querySelector('#list-name').value=l.name;document.querySelector('#test-date').value=l.date;document.querySelector('#pairs').value=l.words.map(w=>[w.en,w.nl,w.alts.join('|'),(w.enAlts||[]).join('|')].map(v=>'"'+v.replaceAll('"','""')+'"').join(',')).join('\n');document.querySelector('#editor-title').textContent='Bewerken: '+l.name;document.querySelector('#editor-title').scrollIntoView();});const csv=document.querySelector('#csv');if(csv)csv.onchange=async()=>{if(csv.files[0])document.querySelector('#pairs').value=await csv.files[0].text();};on('export',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='poek-woordenclub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});const restore=document.querySelector('#restore');if(restore)restore.onchange=async()=>{try{const data=JSON.parse(await restore.files[0].text());validateBackup(data);if(confirm('Huidige lijsten en voortgang vervangen door deze back-up? Exporteer eerst als je die wilt bewaren.')){state=initExtras(data);save();render();}}catch{alert('Dit is geen geldige Lara-back-up. Er is niets gewijzigd.');}};}
function preview(){const box=document.querySelector('#preview-box');try{const words=parsePairs(document.querySelector('#pairs').value),name=document.querySelector('#list-name').value.trim(),errors=validateWords(words);if(!name)errors.unshift('Geef de lijst een naam.');if(!words.length)errors.push('Voeg minstens één woordpaar toe.');if(errors.length){box.innerHTML='<p class="error">'+errors.map(esc).join('<br>')+'</p>';return;}draft={name,date:document.querySelector('#test-date').value,words};box.innerHTML=`<h3>Controleer ${words.length} woorden</h3><div class="scroll"><table><tr><th>Engels</th><th>Nederlands</th><th>Alternatieven NL / EN</th></tr>${words.map(w=>`<tr><td>${esc(w.en)}</td><td>${esc(w.nl)}</td><td>${esc(w.alts.join(', '))} / ${esc(w.enAlts.join(', '))}</td></tr>`).join('')}</table></div><button class="primary" id="save-list">Deze lijst opslaan</button>`;document.querySelector('#save-list').onclick=()=>{const old=state.lists.find(l=>l.id===editId);const words=draft.words.map(w=>({...w,id:old?.words.find(o=>o.en===w.en)?.id||uid()}));if(old)Object.assign(old,{...draft,words});else state.lists.push({...draft,words,id:uid(),active:true});save();editId=null;render();};}catch(e){box.innerHTML='<p class="error">'+esc(e.message)+'</p>';}}
function validateBackup(d){if(d.practice!=null){if(typeof d.practice!=='object'||Array.isArray(d.practice))throw Error();for(const p of Object.values(d.practice)){if(!Number.isFinite(p.passes)||!Number.isFinite(p.goodPasses)||!Array.isArray(p.cleanDays)||!Array.isArray(p.recallDays)||!p.cleanDays.concat(p.recallDays).every(x=>typeof x==='string'))throw Error();}}if(d.studio!=null&&(!Array.isArray(d.studio.awards)||!d.studio.awards.every(g=>typeof g.key==='string'&&typeof g.day==='string'&&typeof g.icon==='string'&&typeof g.name==='string'&&Array.isArray(g.wordIds))))throw Error();if(d.examDate!=null&&!/^\d{4}-\d{2}-\d{2}$/.test(d.examDate))throw Error();if(d.version!==1||!Array.isArray(d.lists)||!d.progress||!Array.isArray(d.rewards))throw Error();const ids=new Set();for(const l of d.lists){if(typeof l.id!=='string'||typeof l.name!=='string'||!Array.isArray(l.words)||typeof l.active!=='boolean')throw Error();for(const w of l.words){if(typeof w.id!=='string'||ids.has(w.id)||typeof w.en!=='string'||typeof w.nl!=='string'||!Array.isArray(w.alts)||!w.alts.every(x=>typeof x==='string')||(w.enAlts&&!w.enAlts.every(x=>typeof x==='string')))throw Error();ids.add(w.id);}}for(const p of Object.values(d.progress)){if(!Array.isArray(p.days)||!Array.isArray(p.sessions)||!Number.isFinite(p.due)||!Number.isFinite(p.attempts))throw Error();}}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.repeat||['choice-ok','type-feedback','feedback'].includes(round?.phase)))e.preventDefault();});
window.addEventListener('pagehide',cleanup);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(audioTimer);audioGeneration++;try{window.speechSynthesis?.cancel();}catch{}}});
render();
</script></body></html>
